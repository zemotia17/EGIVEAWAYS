<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="Enter the giveaway for a chance to win.">
  <meta name="robots" content="noindex, nofollow">
  <title>Enter Giveaway · EGiveaways</title>

  <link rel="stylesheet" href="styles.css">

  <!--
    =========================================================
    ENTRY PAGE STYLES
    Scoped to this page only. Safe to remove if you move
    these rules into styles.css.
    =========================================================
  -->
  <style>
    /* =========================================================
       PAGE BASE
    ========================================================= */
    body.entry-page {
      background:
        radial-gradient(
          1200px 600px at 50% -20%,
          rgba(109, 94, 240, 0.18),
          transparent 60%
        ),
        radial-gradient(
          900px 500px at 100% 100%,
          rgba(167, 139, 250, 0.10),
          transparent 60%
        ),
        var(--bg, #0b0d14);

      color: var(--text, #eef2ff);

      min-height: 100vh;

      display: flex;

      align-items: flex-start;

      justify-content: center;

      padding: 40px 20px 80px;

      overflow-x: hidden;
    }

    /* =========================================================
       ENTRY APP WRAPPER
    ========================================================= */
    .entry-app {
      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      animation: entryFadeIn 0.35s
        cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes entryFadeIn {
      from {
        opacity: 0;

        transform: translateY(10px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }
    }

    /* =========================================================
       HEADER
    ========================================================= */
    .entry-header {
      text-align: center;

      margin-bottom: 24px;

      padding: 0 8px;
    }

    .entry-header-icon {
      width: 64px;

      height: 64px;

      margin: 0 auto 14px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          var(--primary, #6d5ef0),
          #a78bfa
        );

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 2rem;

      box-shadow:
        0 12px 32px
        rgba(109, 94, 240, 0.35);

      animation: entryIconPulse 2.4s
        ease-in-out infinite;
    }

    @keyframes entryIconPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .entry-header-text .entry-brand {
      display: inline-block;

      font-size: 0.75rem;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      color: var(--primary, #6d5ef0);

      margin-bottom: 6px;
    }

    .entry-header-text h1 {
      font-size: 1.6rem;

      font-weight: 800;

      letter-spacing: -0.5px;

      line-height: 1.25;

      margin-bottom: 6px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #cbd5f5
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      background-clip: text;
    }

    .entry-header-text p {
      color: var(--text-secondary, #9aa3b8);

      font-size: 0.9rem;

      max-width: 380px;

      margin: 0 auto;
    }

    /* =========================================================
       STATUS CARD
    ========================================================= */
    .entry-status-card {
      background: var(--surface, #131722);

      border: 1px solid var(--border, #2a3248);

      border-radius: var(--radius, 14px);

      padding: 16px 18px;

      margin-bottom: 14px;

      display: flex;

      align-items: center;

      gap: 14px;

      flex-wrap: wrap;
    }

    .entry-status {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      font-size: 0.72rem;

      font-weight: 700;

      letter-spacing: 0.5px;

      text-transform: uppercase;

      padding: 5px 11px;

      border-radius: 999px;

      white-space: nowrap;

      flex-shrink: 0;
    }

    .entry-status::before {
      content: "";

      width: 6px;

      height: 6px;

      border-radius: 50%;

      background: currentColor;

      box-shadow:
        0 0 8px currentColor;
    }

    .entry-status.open {
      background:
        rgba(46, 204, 113, 0.14);

      color: #2ecc71;

      border: 1px solid
        rgba(46, 204, 113, 0.3);
    }

    .entry-status.upcoming {
      background:
        rgba(243, 156, 18, 0.14);

      color: #f39c12;

      border: 1px solid
        rgba(243, 156, 18, 0.3);
    }

    .entry-status.closed {
      background:
        rgba(231, 76, 60, 0.14);

      color: #e74c3c;

      border: 1px solid
        rgba(231, 76, 60, 0.3);
    }

    .entry-status-info {
      flex: 1;

      display: flex;

      flex-direction: column;

      gap: 4px;

      min-width: 200px;
    }

    .entry-status-row {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      font-size: 0.82rem;
    }

    .entry-status-label {
      color: var(--text-muted, #5f6a82);

      font-weight: 500;
    }

    .entry-status-value {
      color: var(--text, #eef2ff);

      font-weight: 600;

      text-align: right;
    }

    /* =========================================================
       MAIN CARD
    ========================================================= */
    .entry-card {
      background: var(--surface, #131722);

      border: 1px solid var(--border, #2a3248);

      border-radius: var(--radius, 14px);

      padding: 22px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
    }

    /* =========================================================
       FORM
    ========================================================= */
    .entry-form {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }

    .entry-form-header {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .entry-form-icon {
      width: 44px;

      height: 44px;

      border-radius: 12px;

      background:
        var(--surface-2, #1a1f2e);

      border: 1px solid
        var(--border, #2a3248);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 1.3rem;

      flex-shrink: 0;
    }

    .entry-form-header h3 {
      font-size: 0.98rem;

      font-weight: 700;

      margin-bottom: 2px;
    }

    .entry-form-header p {
      font-size: 0.8rem;

      color: var(--text-secondary, #9aa3b8);
    }

    /* =========================================================
       INPUT GROUP
    ========================================================= */
    .entry-input-group {
      display: flex;

      flex-direction: column;

      gap: 12px;

      width: 100%;
    }

    .entry-input {
      display: block;

      width: 100%;

      max-width: 100%;

      min-width: 0;

      box-sizing: border-box;

      padding: 16px 18px;

      background:
        var(--surface-2, #1a1f2e);

      border: 1.5px solid
        var(--border, #2a3248);

      border-radius:
        var(--radius-sm, 10px);

      color: var(--text, #eef2ff);

      font-size: 1rem;

      font-weight: 500;

      line-height: 1.4;

      letter-spacing: 0.2px;

      text-align: center;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;

      -webkit-appearance: none;

      appearance: none;
    }

    .entry-input::placeholder {
      color: var(--text-muted, #5f6a82);

      text-align: center;
    }

    .entry-input:focus {
      outline: none;

      border-color:
        var(--primary, #6d5ef0);

      background:
        var(--surface-3, #232a3d);

      box-shadow:
        0 0 0 4px
        rgba(109, 94, 240, 0.18);
    }

    .entry-input.error {
      border-color: #e74c3c;

      box-shadow:
        0 0 0 4px
        rgba(231, 76, 60, 0.15);

      animation: entryShake 0.35s
        ease;
    }

    @keyframes entryShake {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    /* Remove number input spinners */
    .entry-input[type="number"]::-webkit-outer-spin-button,
    .entry-input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;

      margin: 0;
    }

    .entry-input[type="number"] {
      -moz-appearance: textfield;

      appearance: textfield;
    }

    .entry-submit-button {
      width: 100%;

      box-sizing: border-box;

      padding: 16px 20px;

      font-size: 1rem;

      font-weight: 700;

      letter-spacing: 0.3px;

      border-radius:
        var(--radius-sm, 10px);
    }

    .entry-error-message {
      min-height: 18px;

      font-size: 0.82rem;

      color: #e74c3c;

      font-weight: 500;

      text-align: center;

      line-height: 1.35;
    }

    /* =========================================================
       STATE SCREENS
       (loading / error / upcoming / closed / success)
    ========================================================= */
    .entry-state {
      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;

      gap: 12px;

      padding: 40px 20px;
    }

    .entry-state h2 {
      font-size: 1.15rem;

      font-weight: 700;

      letter-spacing: -0.3px;
    }

    .entry-state p {
      color: var(--text-secondary, #9aa3b8);

      font-size: 0.9rem;

      max-width: 380px;

      line-height: 1.5;
    }

    .entry-state-icon {
      width: 72px;

      height: 72px;

      border-radius: 22px;

      background:
        var(--surface-2, #1a1f2e);

      border: 1px solid
        var(--border, #2a3248);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 2rem;

      margin-bottom: 4px;
    }

    .entry-state-icon.success-icon {
      background:
        linear-gradient(
          135deg,
          rgba(46, 204, 113, 0.2),
          rgba(46, 204, 113, 0.08)
        );

      border: 1px solid
        rgba(46, 204, 113, 0.35);

      animation: entrySuccessPop
        0.5s
        cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes entrySuccessPop {
      0% {
        transform: scale(0.6);

        opacity: 0;
      }

      100% {
        transform: scale(1);

        opacity: 1;
      }
    }

    /* Loading spinner */
    .entry-loading-spinner {
      width: 44px;

      height: 44px;

      border-radius: 50%;

      border: 3px solid
        var(--surface-3, #232a3d);

      border-top-color:
        var(--primary, #6d5ef0);

      animation: entrySpin 0.9s
        linear infinite;

      margin-bottom: 4px;
    }

    @keyframes entrySpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Success value box */
    .entry-success-message {
      color:
        var(--text-secondary, #9aa3b8);
    }

    .entry-success-value {
      width: 100%;

      max-width: 320px;

      background:
        var(--surface-2, #1a1f2e);

      border: 1px solid
        var(--border, #2a3248);

      border-radius:
        var(--radius-sm, 10px);

      padding: 14px 16px;

      display: flex;

      flex-direction: column;

      gap: 4px;

      margin: 6px 0;
    }

    .entry-success-label {
      font-size: 0.72rem;

      font-weight: 600;

      letter-spacing: 0.6px;

      text-transform: uppercase;

      color:
        var(--text-muted, #5f6a82);
    }

    .entry-success-value strong {
      font-size: 1.15rem;

      font-weight: 700;

      color: var(--text, #eef2ff);

      word-break: break-word;
    }

    .entry-success-hint {
      font-size: 0.82rem;

      color:
        var(--text-muted, #5f6a82);

      max-width: 340px;
    }

    /* =========================================================
       SUCCESS SCREEN — DONE BUTTON
    ========================================================= */
    .entry-done-button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      width: 100%;

      max-width: 320px;

      box-sizing: border-box;

      margin-top: 18px;

      padding: 15px 24px;

      border: none;

      border-radius:
        var(--radius-sm, 10px);

      background:
        linear-gradient(
          135deg,
          var(--primary, #6d5ef0),
          #a78bfa
        );

      color: #ffffff;

      font-size: 0.98rem;

      font-weight: 700;

      letter-spacing: 0.4px;

      cursor: pointer;

      box-shadow:
        0 10px 28px
        rgba(109, 94, 240, 0.35);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .entry-done-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 34px
        rgba(109, 94, 240, 0.45);

      filter: brightness(1.05);
    }

    .entry-done-button:active {
      transform: translateY(0);

      filter: brightness(0.96);
    }

    .entry-done-button:focus-visible {
      outline: 2px solid
        rgba(167, 139, 250, 0.85);

      outline-offset: 3px;
    }

    .entry-done-button::before {
      content: "✓";

      font-size: 1.05rem;

      font-weight: 800;
    }

    /* =========================================================
       FOOTER
    ========================================================= */
    .entry-footer {
      text-align: center;

      margin-top: 22px;

      font-size: 0.78rem;

      color: var(--text-muted, #5f6a82);
    }

    .entry-footer strong {
      color:
        var(--text-secondary, #9aa3b8);

      font-weight: 700;
    }

    /* =========================================================
       TOASTS
    ========================================================= */
    .toast-container {
      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      display: flex;

      flex-direction: column;

      gap: 8px;

      pointer-events: none;

      width: calc(100% - 40px);

      max-width: 360px;
    }

    .toast {
      background:
        var(--surface-2, #1a1f2e);

      border: 1px solid
        var(--border, #2a3248);

      color: var(--text, #eef2ff);

      padding: 12px 16px;

      border-radius:
        var(--radius-sm, 10px);

      font-size: 0.88rem;

      font-weight: 500;

      box-shadow:
        0 12px 32px
        rgba(0, 0, 0, 0.4);

      text-align: center;

      opacity: 0;

      transform: translateY(-10px);

      transition:
        opacity 0.25s,
        transform 0.25s;

      pointer-events: auto;
    }

    .toast.visible {
      opacity: 1;

      transform: translateY(0);
    }

    .toast.success {
      border-color:
        rgba(46, 204, 113, 0.4);

      color: #2ecc71;
    }

    .toast.error {
      border-color:
        rgba(231, 76, 60, 0.4);

      color: #e74c3c;
    }

    .toast.info {
      border-color:
        rgba(52, 152, 219, 0.4);

      color: #3498db;
    }

    /* =========================================================
       CONFETTI
    ========================================================= */
    .confetti-container {
      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 9998;
    }

    .confetti-piece {
      position: absolute;

      top: -20px;

      width: 8px;

      height: 14px;

      border-radius: 2px;

      opacity: 0.9;

      animation-name: entryConfettiFall;

      animation-timing-function:
        cubic-bezier(0.25, 0.46, 0.45, 0.94);

      animation-fill-mode: forwards;
    }

    @keyframes entryConfettiFall {
      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0.4;
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */
    @media (max-width: 480px) {
      body.entry-page {
        padding: 24px 14px 60px;
      }

      .entry-header-text h1 {
        font-size: 1.35rem;
      }

      .entry-card {
        padding: 18px;

        border-radius: 12px;
      }

      .entry-status-card {
        padding: 14px;

        gap: 10px;
      }

      .entry-status-row {
        font-size: 0.78rem;
      }

      .entry-input {
        font-size: 16px; /* Prevents iOS zoom on focus */

        padding: 15px 16px;
      }

      .entry-state {
        padding: 32px 12px;
      }

      .entry-done-button {
        padding: 14px 20px;

        font-size: 0.95rem;
      }
    }

    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */
    @media (max-width: 360px) {
      .entry-card {
        padding: 14px;
      }

      .entry-input {
        padding: 14px;

        font-size: 16px;
      }

      .entry-submit-button {
        padding: 14px 16px;

        font-size: 0.95rem;
      }

      .entry-done-button {
        padding: 13px 16px;

        font-size: 0.92rem;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }

      .entry-header-icon {
        animation: none;
      }

      .entry-done-button {
        transition: none;
      }
    }
  </style>
</head>

<body class="entry-page">

  <!--
    =========================================================
    MAIN CONTAINER
    entry.js renders everything here.
    =========================================================
  -->
  <main
    id="entryApp"
    class="entry-app"
    role="main"
    aria-live="polite"
  >
    <!--
      Fallback content shown before JS runs.
      entry.js will replace this immediately.
    -->
    <div class="entry-state entry-state-loading">

      <div class="entry-loading-spinner"></div>

      <h2>
        Loading giveaway...
      </h2>

      <p>
        Please wait a moment.
      </p>

    </div>
  </main>


  <!--
    =========================================================
    TOASTS
    entry.js also auto-creates this if missing,
    but declaring it here prevents a flash of unstyled
    toasts on the very first message.
    =========================================================
  -->
  <div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!--
    =========================================================
    NOSCRIPT FALLBACK
    =========================================================
  -->
  <noscript>
    <div
      style="
        position: fixed;
        inset: 0;
        background: #0b0d14;
        color: #eef2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      "
    >
      <div style="font-size: 2.5rem;">🚫</div>

      <h2 style="font-size: 1.2rem;">
        JavaScript Required
      </h2>

      <p
        style="
          color: #9aa3b8;
          max-width: 320px;
          line-height: 1.5;
        "
      >
        This entry form needs JavaScript to work.
        Please enable it in your browser and reload
        the page.
      </p>
    </div>
  </noscript>


  <!--
    =========================================================
    ENTRY SCRIPT
    =========================================================
  -->
  <script src="entry.js"></script>

</body>
</html>
